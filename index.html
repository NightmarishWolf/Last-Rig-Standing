<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last Rig Standing — Naval Strategy</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0b1724">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/dialogs.css">
  <link rel="stylesheet" href="css/tutorial.css">
  <link rel="stylesheet" href="css/timer.css">
  <link rel="stylesheet" href="css/research.css">
  <link rel="stylesheet" href="css/bases.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">LAST RIG <span>STANDING</span></div>
    <div id="turn-info" class="turn-info"></div>
    <div id="timer" class="timer hidden"></div>
    <div class="top-actions">
      <button id="btn-sound" class="ghost" title="Sound">🔊</button>
      <button id="btn-waves" class="ghost" title="Animated waves">🌊</button>
      <button id="btn-summary" class="ghost" title="Show the turn summary again">📋</button>
      <button id="btn-help" class="ghost">Rules</button>
      <button id="btn-menu" class="ghost">Menu</button>
    </div>
  </header>

  <main class="layout">
    <section class="board-wrap">
      <div id="coach" class="coach hidden"></div>
      <div class="board-frame">
        <canvas id="board"></canvas>
        <canvas id="minimap" class="minimap hidden" title="Minimap: click or drag to move the view"></canvas>
      </div>
      <div id="status" class="status"></div>
    </section>
    <aside id="panel" class="panel"></aside>
  </main>

  <!-- Full-screen overlays -->
  <div id="home" class="home hidden"></div>
  <div id="research" class="research hidden"></div>
  <div id="overlay" class="overlay hidden"><div class="overlay-card" id="overlay-card"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
